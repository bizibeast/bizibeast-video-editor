name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  focused-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: node scripts/setup.mjs --install --json
      - run: npm run test:quick
      - run: npm run test:crew
      - run: npm run test:strict
      - run: node scripts/validate-repo.mjs
      - run: npm run render:smoke
