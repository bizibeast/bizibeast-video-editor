<!doctype html>
<html lang="en" data-composition-variables='[{"id":"backText","type":"string","label":"Back layer","default":"One clear visual idea"},{"id":"frontText","type":"string","label":"Front layer","default":"Built for attention"},{"id":"showBack","type":"boolean","label":"Show back layer","default":true},{"id":"showFront","type":"boolean","label":"Show front layer","default":true}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Sunburst layered portrait</title>
    <link rel="stylesheet" href="assets/sunburst.css" />
    <style>
      body { background: transparent; color: white; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      .back-card { position: absolute; left: 54px; right: 54px; top: 150px; min-height: 330px; padding: 52px; border-radius: 46px; background: var(--sunburst); box-shadow: 0 30px 80px rgba(0,0,0,.24); animation: rise .55s cubic-bezier(.16,1,.3,1) .14s both; }
      .kicker { margin-bottom: 19px; color: var(--yellow); font-size: 25px; font-weight: 900; letter-spacing: .16em; text-transform: uppercase; }
      .back-copy { max-width: 820px; font-size: 82px; line-height: .93; }
      .front-card { position: absolute; right: 58px; bottom: 265px; max-width: 610px; padding: 28px 34px; border: 3px solid white; border-radius: 28px; background: rgba(17,17,17,.9); font-size: 43px; font-weight: 850; line-height: 1.02; animation: rise .45s cubic-bezier(.16,1,.3,1) .48s both; }
    </style>
  </head>
  <body>
    <main id="root" data-composition-id="bizibeast-layered-portrait-v1" data-no-timeline data-start="0" data-width="1080" data-height="1920" data-duration="5">
      <section id="back-layer" class="clip" data-start="0" data-duration="5" data-track-index="1">
        <div class="back-card">
          <div class="kicker">BiziBeast</div>
          <div class="back-copy display" data-var-text="backText">One clear visual idea</div>
        </div>
      </section>
      <section id="front-layer" class="clip" data-start="0" data-duration="5" data-track-index="2">
        <div class="front-card" data-var-text="frontText">Built for attention</div>
      </section>
    </main>
    <script>
      const values = window.__hyperframes?.getVariables?.() || {};
      if (values.showBack === false) document.getElementById("back-layer").style.opacity = "0";
      if (values.showFront === false) document.getElementById("front-layer").style.opacity = "0";
    </script>
  </body>
</html>
