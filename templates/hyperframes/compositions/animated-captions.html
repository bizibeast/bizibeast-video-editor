<!doctype html>
<html lang="en" data-composition-variables='[{"id":"line1","type":"string","label":"Caption one","default":"Edit with intention."},{"id":"line2","type":"string","label":"Caption two","default":"Move with rhythm."},{"id":"line3","type":"string","label":"Caption three","default":"Finish with taste."}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Sunburst animated captions</title>
    <link rel="stylesheet" href="assets/sunburst.css" />
    <style>
      body { background: transparent; color: white; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      .rail { position: absolute; left: 70px; right: 70px; bottom: 260px; height: 290px; display: grid; place-items: center; }
      .cue { position: absolute; max-width: 920px; padding: 24px 34px; border-radius: 26px; background: rgba(17,17,17,.9); box-shadow: 0 18px 48px rgba(0,0,0,.3); font-size: 64px; font-weight: 850; line-height: 1.03; text-align: center; opacity: 0; animation: caption 1.35s cubic-bezier(.16,1,.3,1) both; }
      .cue::first-line { color: var(--yellow); }
      .cue:nth-child(1) { animation-delay: .25s; }
      .cue:nth-child(2) { animation-delay: 1.75s; }
      .cue:nth-child(3) { animation-delay: 3.25s; }
    </style>
  </head>
  <body>
    <main id="root" data-composition-id="bizibeast-captions-v1" data-no-timeline data-start="0" data-width="1080" data-height="1920" data-duration="5">
      <section id="caption-scene" class="clip" data-start="0" data-duration="5" data-track-index="1">
        <div class="rail">
          <div class="cue" data-var-text="line1">Edit with intention.</div>
          <div class="cue" data-var-text="line2">Move with rhythm.</div>
          <div class="cue" data-var-text="line3">Finish with taste.</div>
        </div>
      </section>
    </main>
  </body>
</html>
