<!doctype html>
<html lang="en" data-composition-variables='[{"id":"name","type":"string","label":"Name","default":"Your Name"},{"id":"role","type":"string","label":"Role","default":"Creator and builder"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Sunburst lower third</title>
    <link rel="stylesheet" href="assets/sunburst.css" />
    <style>
      body { background: transparent; color: var(--ink); }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      .card { position: absolute; left: 68px; bottom: 330px; min-width: 620px; max-width: 880px; padding: 34px 42px 30px; border-radius: 30px; background: var(--paper); box-shadow: 0 22px 60px rgba(0,0,0,.28); animation: rise .5s cubic-bezier(.16,1,.3,1) .18s both; }
      .accent { width: 130px; height: 12px; margin-bottom: 22px; border-radius: 99px; background: var(--sunburst); transform-origin: left; animation: wipe .62s cubic-bezier(.16,1,.3,1) .35s both; }
      .name { font-size: 65px; line-height: .98; }
      .role { margin-top: 13px; color: var(--red); font-size: 27px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; }
    </style>
  </head>
  <body>
    <main id="root" data-composition-id="bizibeast-lower-third-v1" data-no-timeline data-start="0" data-width="1080" data-height="1920" data-duration="5">
      <section id="lower-third-scene" class="clip" data-start="0" data-duration="5" data-track-index="1">
        <div class="card">
          <div class="accent" aria-hidden="true"></div>
          <div class="name display" data-var-text="name">Your Name</div>
          <div class="role" data-var-text="role">Creator and builder</div>
        </div>
      </section>
    </main>
  </body>
</html>
