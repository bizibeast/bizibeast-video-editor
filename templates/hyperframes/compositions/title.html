<!doctype html>
<html lang="en" data-composition-variables='[{"id":"eyebrow","type":"string","label":"Eyebrow","default":"BiziBeast studio"},{"id":"title","type":"string","label":"Title","default":"Make it unmistakable."},{"id":"support","type":"string","label":"Support","default":"A bold idea, edited with taste."}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Sunburst title</title>
    <link rel="stylesheet" href="assets/sunburst.css" />
    <style>
      body { background: var(--paper); color: var(--ink); }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      .scene { background: var(--paper); }
      .orb { position: absolute; width: 840px; height: 840px; right: -120px; top: -150px; border-radius: 50%; background: var(--sunburst); animation: drift 5.4s ease-in-out .2s both; }
      .rule { position: absolute; left: 90px; right: 90px; top: 76px; height: 5px; background: var(--ink); transform-origin: left; animation: wipe .72s cubic-bezier(.16,1,.3,1) .12s both; }
      .copy { position: absolute; left: 90px; top: 190px; width: 1280px; }
      .eyebrow { font-size: 28px; font-weight: 850; letter-spacing: .15em; text-transform: uppercase; animation: rise .38s ease-out .42s both; }
      h1 { margin: 48px 0 0; font-size: 170px; line-height: .88; max-width: 1250px; animation: rise .52s cubic-bezier(.16,1,.3,1) .2s both; }
      p { margin: 56px 0 0; max-width: 870px; font-size: 38px; font-weight: 650; line-height: 1.22; animation: rise .4s ease-out .54s both; }
      .corner { position: absolute; left: 0; bottom: 0; width: 360px; height: 30px; background: var(--sunburst); }
    </style>
  </head>
  <body>
    <main id="root" data-composition-id="bizibeast-title-v1" data-no-timeline data-start="0" data-width="1920" data-height="1080" data-duration="6">
      <section id="title-scene" class="clip scene" data-start="0" data-duration="6" data-track-index="1">
        <div class="orb" aria-hidden="true"></div>
        <div class="rule" aria-hidden="true"></div>
        <div class="copy">
          <div class="eyebrow" data-var-text="eyebrow">BiziBeast studio</div>
          <h1 class="display" data-var-text="title">Make it unmistakable.</h1>
          <p data-var-text="support">A bold idea, edited with taste.</p>
        </div>
        <div class="corner" aria-hidden="true"></div>
      </section>
    </main>
  </body>
</html>
